<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{blog_title}}</title>
    <style>
{{styles}}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-header-inner">
            <a href="{{home_href}}" class="site-title">{{blog_title}}</a>
            <div class="site-nav-stack">
                <nav class="site-links site-links-primary">
                    {{primary_nav_links}}
                </nav>
                <nav class="site-links site-links-secondary">
                    {{secondary_nav_links}}
                </nav>
            </div>
        </div>
    </header>

    <main>
        <header class="blog-header">
            <p class="eyebrow">Orbiting archive</p>
            <h1>{{blog_title}}</h1>
            <p class="subtitle">{{blog_subtitle}}</p>
        </header>

        {{posts}}
    </main>

    <footer class="site-footer">
        {{blog_title}} &middot; {{blog_subtitle}}
    </footer>
</body>
</html>
